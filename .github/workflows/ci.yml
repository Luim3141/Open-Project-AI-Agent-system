name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r openproject/ai/requirements.lock.txt
      - run: python scripts/check_publication.py
      - run: python -m unittest discover -s tests -p 'test_publication_tools.py'
      - run: python -m unittest discover -s tests -p 'test_secret_redaction_guard.py'
      - run: python -m unittest discover -s openproject/ai/tests -p 'test_agent_observer.py'
        env:
          PYTHONPATH: openproject/ai
      - run: python -m unittest discover -s openproject/ai/tests -p 'test_agent_models.py'
        env:
          PYTHONPATH: openproject/ai
      - run: python -m unittest discover -s openproject/ai/tests -p 'test_prompt_injection_and_secret_exfil.py'
        env:
          PYTHONPATH: openproject/ai
      - run: python -m unittest discover -s openproject/ai/tests -p 'test_backup_restore_drill.py'
        env:
          PYTHONPATH: openproject/ai
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: openproject/ai/core/agent-studio-v2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: openproject/ai/core/agent-studio-v2/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
