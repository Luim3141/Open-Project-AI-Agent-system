# Local upgrade overlay only; main stays on its separately approved deployment.
services:
  staging-gateway:
    depends_on:
      staging-web: {condition: service_healthy}
    networks:
      automation:
        aliases: [gateway]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8090/health',headers={'Host':'gateway:8090'}),timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 45s
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.6@sha256:dd580fe1ab6e99e85bc66f2acf8bc8c5e9409fbe61b2e2803c5024403ef52833
    restart: unless-stopped
    environment:
      TZ: Asia/Bangkok
      GENERIC_TIMEZONE: Asia/Bangkok
      N8N_HOST: localhost
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_DISABLED_MODULES: mcp-registry
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.code","n8n-nodes-base.readWriteFile","n8n-nodes-base.ssh","n8n-nodes-base.git","n8n-nodes-base.localFileTrigger"]'
      NODE_OPTIONS: --max-old-space-size=256
    secrets: [n8n_encryption_key]
    volumes: [n8n-data:/home/node/.n8n]
    networks: [automation]
    depends_on:
      staging-gateway: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777", "/home/node/.cache:size=128m,uid=1000,gid=1000,mode=0700"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:5678/healthz/readiness',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  n8n-editor:
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    user: "1000:1000"
    ports: ["127.0.0.1:5678:5678"]
    volumes:
      - ./automation/Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [automation, editor]
    depends_on:
      n8n: {condition: service_healthy}
    read_only: true
    tmpfs: ["/data:size=8m,uid=1000,gid=1000,mode=0700", "/config:size=8m,uid=1000,gid=1000,mode=0700"]
    cap_drop: [ALL]
    # The image binary carries this file capability, including on high ports.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:5678/healthz/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
secrets:
  n8n_encryption_key:
    file: ${QLDAPM_N8N_KEY_PATH:?Prepare private persistent n8n key once}
volumes:
  n8n-data:
networks:
  automation:
    internal: true
  editor:
