# Explicit owner-authorized virtual LAN; never include in main deployment.
services:
  staging-web:
    environment:
      OPENPROJECT_HOST__NAME: 26.88.211.101
      OPENPROJECT_ADDITIONAL__HOST__NAMES: '["26.88.211.101", "localhost:18091", "127.0.0.1:18091", "staging-web", "localhost:8088"]'
      OPENPROJECT_HTTPS: "true"
  radmin-proxy:
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    user: "1000:1000"
    ports: ["26.88.211.101:443:443"]
    volumes:
      - ./automation/Radmin.Caddyfile:/etc/caddy/Caddyfile:ro
      - ${AI_RUNTIME}/radmin-caddy:/data
    networks: [stage-front]
    depends_on:
      staging-web: {condition: service_healthy}
    read_only: true
    tmpfs: ["/config:size=8m,uid=1000,gid=1000,mode=0700"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
