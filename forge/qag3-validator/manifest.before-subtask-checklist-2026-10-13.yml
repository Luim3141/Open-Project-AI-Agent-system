modules:
  jira:workflowValidator:
    - key: qag3-pm-only
      name: QAG3 PM approval
      description: Only the two approved PM accounts may perform this QAG3 transition.
      projectTypes:
        - company-managed
      expression: >-
        issue.project.id == 10002 && issue.project.key == 'QAG3' && user != null
        && user.active && ['712020:0d04982c-00bf-46af-b3a7-446d0f44edfb',
         '712020:47b24428-aa71-4363-b68f-29ed2285aad8'].includes(user.accountId)
      errorMessage: Only an approved QAG3 PM may perform this transition.
    - key: qag3-epic-children-done
      name: QAG3 Epic child Tasks complete
      description: Reject empty Epics and Epics containing a child Task not in Done.
      projectTypes:
        - company-managed
      expression: >-
        let project = issue.project;
        let children = issue.childIssues;
        let subtaskLists = children == null ? [] : children.map(child => child == null ? null : child.childIssues);
        project.id == 10002 && project.key == 'QAG3' && issue.issueType.id == 10000 &&
        children != null && children.length > 0 && children.every(child => child != null &&
        child.key.indexOf('QAG3-') == 0 && child.issueType.id == 10011 && child.status.id == 10009) &&
        subtaskLists.every(subtasks => subtasks != null && subtasks.every(subtask => subtask != null &&
        subtask.key.indexOf('QAG3-') == 0 && subtask.issueType.id == 10010 && subtask.status.id == 10009))
      errorMessage: An Epic must contain at least one QAG3 Task, and all its child
        Tasks must be Done.
    - key: qag3-fresh-change-reason
      name: QAG3 fresh change reason
      description: Require a nonblank reason changed on this transition, not a previously saved reason.
      projectTypes:
        - company-managed
      expression: >-
        let current = issue.customfield_10043;
        let previous = originalIssue.customfield_10043;
        let reason = typeof current == 'Map' ? new RichText(current).plainText : typeof current == 'RichText' ? current.plainText : current;
        let oldReason = typeof previous == 'Map' ? new RichText(previous).plainText : typeof previous == 'RichText' ? previous.plainText : previous;
        issue.project.id == 10002 && issue.project.key == 'QAG3' &&
        [10000, 10011, 10010].includes(issue.issueType.id) &&
        typeof reason == 'string' && reason.trim().length > 0 &&
        (oldReason == null || (typeof oldReason == 'string' && reason.trim() != oldReason.trim()))
      errorMessage: Enter a new nonblank change reason on this transition; a previously saved reason is not sufficient.
    - key: qag3-task-subtasks-done
      name: QAG3 Task subtasks complete
      description: Require every current Subtask to be Done before accepting a Task.
      projectTypes:
        - company-managed
      expression: >-
        issue.project.id == 10002 && issue.project.key == 'QAG3' &&
        issue.issueType.id == 10011 && issue.childIssues != null &&
        issue.childIssues.every(child => child != null &&
        child.project.id == 10002 && child.issueType.id == 10010 && child.status.id == 10009)
      errorMessage: Every current QAG3 Subtask must be Done before this Task can be accepted.
    - key: qag3-task-delivery-checklist
      name: QAG3 Task delivery checklist
      description: Require delivery checklist and evidence text; does not authenticate reviewers or attest retest results.
      projectTypes:
        - company-managed
      expression: >-
        let choices = issue.customfield_10044;
        let evidenceValue = issue.customfield_10045;
        let evidence = typeof evidenceValue == 'Map' ? new RichText(evidenceValue).plainText : evidenceValue;
        issue.project.id == 10002 && issue.project.key == 'QAG3' &&
        issue.issueType.id == 10011 && choices != null &&
        ['10020', '10021', '10022', '10025', '10026', '10027'].every(id => choices.some(option => option != null && option.id == id)) &&
        choices.some(option => option != null && option.id == '10023') != choices.some(option => option != null && option.id == '10024') &&
        typeof evidence == 'string' && evidence.trim().length > 0
      errorMessage: Complete the delivery checklist, choose exactly one retest outcome, and provide review/test/deployment evidence.
    - key: qag3-qa-attest
      name: QAG3 QA test attestation
      description: QA submits PASS; the named QAG3 owner may submit SIMULATED PASS on simulation-labelled work only.
      projectTypes:
        - company-managed
      expression: >-
        let plain = value => typeof value == 'Map' ? new RichText(value).plainText : value;
        let evidence = plain(issue.customfield_10045);
        let previous = plain(originalIssue.customfield_10045);
        let lines = typeof evidence == 'string' ? evidence.split('\n').map(line => line.trim()) : [];
        let prefixes = ['Revision:', 'Environment:', 'Test scope:', 'Result:', 'Evidence:', 'Retest:', 'Bug references / retest rationale:'];
        let value = prefix => lines.filter(line => line.indexOf(prefix) == 0).map(line => line.slice(prefix.length).trim());
        let choices = issue.customfield_10044;
        let checked = id => choices != null && choices.some(option => option != null && option.id == id);
        issue.project.id == 10002 && issue.project.key == 'QAG3' &&
        [10011, 10010].includes(issue.issueType.id) && originalIssue.status.id == 10018 &&
        user != null && user.active &&
        typeof evidence == 'string' && (previous == null || (typeof previous == 'string' && evidence.trim() != previous.trim())) &&
        prefixes.every(prefix => value(prefix).length == 1 && value(prefix)[0].length > 0) &&
        ((user.accountId == '712020:94d1f95d-9618-4f25-8284-41105336b942' && value('Result:')[0] == 'PASS') ||
        (user.accountId == '712020:0d04982c-00bf-46af-b3a7-446d0f44edfb' && issue.labels.includes('qag3-simulation') && originalIssue.labels.includes('qag3-simulation') && value('Result:')[0] == 'SIMULATED PASS')) &&
        value('Environment:')[0].indexOf('Test - ') == 0 && value('Environment:')[0].length > 7 &&
        checked('10022') && checked('10023') != checked('10024') &&
        ((value('Retest:')[0] == 'PASSED' && checked('10023')) || (value('Retest:')[0] == 'NOT REQUIRED' && checked('10024')))
      errorMessage: QA requires fresh PASS; the named owner requires a pre-existing qag3-simulation label and SIMULATED PASS. Revision, Test scope, evidence and consistent retest are mandatory.
    - key: qag3-qa-current
      name: QAG3 current QA attestation
      description: Authenticate committed QA provenance and unchanged pending fields. Task Approve/Deploy must also run QA freshness companion; Subtask legacy checks remain.
      projectTypes:
        - company-managed
