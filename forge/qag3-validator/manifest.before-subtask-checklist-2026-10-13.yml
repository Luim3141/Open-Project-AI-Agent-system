        let evidence = plain(issue.customfield_10045);
        let previous = plain(originalIssue.customfield_10045);
        let history = task ? [] : originalIssue.changelogs;
        let passes = history.filter(change => change.items.some(item => item.fieldId == 'status' && item.from == '10018' && item.to == '10012'));
        let pass = task ? originalIssue.getNewestChangelog('status', {from: '10018', to: '10012'}) : (passes.length > 0 ? passes[0] : null);
        let signature = task ? originalIssue.getNewestChangelog('customfield_10045') : pass;
        let author = pass == null ? null : pass.author;
        let parent = task ? null : issue.parent;
        let originalParent = task ? null : originalIssue.parent;
        let assignee = task ? null : issue.assignee;
        let originalAssignee = task ? null : originalIssue.assignee;
        let description = issue.description;
        let originalDescription = originalIssue.description;
        let newer = pass != null ? history.slice(0, history.map(change => change.id).indexOf(pass.id)) : [];
        let lines = typeof evidence == 'string' ? evidence.split('\n').map(line => line.trim()) : [];
        let value = prefix => lines.filter(line => line.indexOf(prefix) == 0).map(line => line.slice(prefix.length).trim());
        let choices = issue.customfield_10044;
        let checked = id => choices != null && choices.some(option => option != null && option.id == id);
        project.id == 10002 && project.key == 'QAG3' &&
        [10011, 10010].includes(issue.issueType.id) && [10012, 10019].includes(originalIssue.status.id) &&
        pass != null && author != null && author.active &&
        signature != null && signature.id == pass.id && signature.items.some(item => item.fieldId == 'customfield_10045' && item.fromString != item.toString && item.toString == evidence) &&
        typeof evidence == 'string' && evidence == previous &&
        ['Revision:', 'Environment:', 'Test scope:', 'Result:', 'Evidence:', 'Retest:', 'Bug references / retest rationale:'].every(prefix => value(prefix).length == 1 && value(prefix)[0].length > 0) &&
        ((author.accountId == '712020:94d1f95d-9618-4f25-8284-41105336b942' && value('Result:')[0] == 'PASS') ||
        (author.accountId == '712020:0d04982c-00bf-46af-b3a7-446d0f44edfb' && issue.labels.includes('qag3-simulation') && originalIssue.labels.includes('qag3-simulation') && value('Result:')[0] == 'SIMULATED PASS')) &&
        value('Environment:')[0].indexOf('Test - ') == 0 && value('Environment:')[0].length > 7 &&
        checked('10022') && checked('10023') != checked('10024') &&
        ((value('Retest:')[0] == 'PASSED' && checked('10023')) || (value('Retest:')[0] == 'NOT REQUIRED' && checked('10024'))) &&
        issue.summary == originalIssue.summary && (description == null ? null : description.plainText) == (originalDescription == null ? null : originalDescription.plainText) &&
        (parent == null ? originalParent == null : originalParent != null && parent.id == originalParent.id) &&
        (assignee == null ? originalAssignee == null : originalAssignee != null && assignee.accountId == originalAssignee.accountId) &&
        (task || newer.every(change => change.items.every(item => item != null && typeof item.fieldId == 'string' && item.fieldId.length > 0 &&
        !['summary', 'description', 'parent', 'assignee', 'customfield_10045'].includes(item.fieldId) &&
        (item.fieldId != 'status' || (issue.issueType.id == 10011 && item.from == '10012' && item.to == '10019')))))
      errorMessage: QA evidence is missing or stale. Return to testing and obtain a fresh QA PASS for the current revision before approval; do not edit the QA evidence after it is signed.
